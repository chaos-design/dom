name: Deploy Site to Github Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 直接用 npm 安装 pnpm，不经过 pnpm/action-setup。
      # action-setup 会把 package.json 的 packageManager 字段视为「另一个
      # pnpm 版本」并与之冲突，而 corepack 会在本地每次运行 pnpm 时
      # 自动写回该字段，导致 CI 结果取决于一次本地操作的副作用。
      - name: Install pnpm (latest)
        run: npm install -g pnpm@latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      # setup-node 会在结束时校验缓存目录是否存在；pnpm 的 store 目录是
      # 按需创建的，这里显式建好，否则 post 步骤会因
      # "Path Validation Error" 判定 job 失败，从而阻断 deploy。
      - name: Ensure pnpm store exists
        run: mkdir -p "$(pnpm store path)"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: |
          pnpm run build
          touch ./packages/playground/dist/.nojekyll
          ls -al ./packages/playground/dist

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./packages/playground/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publish to GitHub Pages 🚀
        id: deployment
        uses: actions/deploy-pages@v4
