name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  check-files:
    runs-on: ubuntu-latest
    name: Check changed files
    outputs:
      changed-files: ${{ toJSON(steps.changed-files-specific.outputs) }}
      bump-version: ${{ steps.changed-files-specific.outputs.only_changed == 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Get changed files in the docs folder
        id: changed-files-specific
        uses: tj-actions/changed-files@v42
        with:
          files: |
            *
            scripts/**
            .github/**
          files_ignore: |
            packages/**

  release:
    if: needs.check-files.outputs.bump-version == 'true'
    runs-on: ubuntu-latest
    needs:
      - check-files
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 直接用 npm 安装 pnpm，不经过 pnpm/action-setup。
      # action-setup 会把 package.json 的 packageManager 字段视为「另一个
      # pnpm 版本」并与之冲突，而 corepack 会在本地每次运行 pnpm 时
      # 自动写回该字段，导致 CI 结果取决于一次本地操作的副作用。
      - name: Install pnpm (latest)
        run: npm install -g pnpm@latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          registry-url: https://registry.npmjs.org/
          node-version: 22
          cache: "pnpm"

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Publish package
        run: |
          npm config set '//registry.npmjs.org/:_authToken' "${{ secrets.NPM_TOKEN }}"
          pnpm run publish-pkg

      - run: npx changelogithub
        env:
          GITHUB_TOKEN: ${{secrets.ACCESS_TOKEN}}
