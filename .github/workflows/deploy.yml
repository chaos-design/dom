name: Deploy Site to Github Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest
          run_install: false
        env:
          # pnpm 12 起，依赖构建脚本被忽略时直接报错（ERR_PNPM_IGNORED_BUILDS）。
          # action-setup 会在一个空目录里安装 pnpm 本身，必然触发该错误，
          # 导致 version: latest 永远装不上。此处只对该步骤放宽，
          # 仓库自身的 .npmrc 仍保持严格校验。
          npm_config_strict_dep_builds: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: |
          pnpm run build
          touch ./packages/playground/dist/.nojekyll
          ls -al ./packages/playground/dist

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./packages/playground/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publish to GitHub Pages 🚀
        id: deployment
        uses: actions/deploy-pages@v4
